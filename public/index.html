<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0E2A9E" />
  <meta name="color-scheme" content="only light" />
  <link rel="icon" type="image/svg+xml" href="/brand/icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="AZ Elétrica" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AZ Elétrica</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="/style.css?v=11" />
</head>
<body>

<div id="login-screen" style="display:none">
  <img class="login-brand" src="/brand/logo-full.png" alt="AZ Elétrica — Sua energia em boas mãos!" />
  <div class="login-box">
    <div class="login-logo">Entrar</div>
    <p class="login-desc">Sistema de gestão de equipes</p>
    <form id="login-form">
      <div class="field"><label>Email</label><input id="login-email" type="email" placeholder="seu@email.com" required autocomplete="email" /></div>
      <div class="field"><label>Senha</label><input id="login-senha" type="password" placeholder="••••••••" required autocomplete="current-password" /></div>
      <button id="btn-login" type="submit" class="btn btn-p btn-full">Entrar</button>
    </form>
  </div>
</div>

<div id="app" style="display:none">
  <div class="layout">
    <header class="mobile-header">
      <div class="mh-brand"><img class="brand-mark" src="/brand/logo-mark.svg" alt="AZ" /><span class="brand-txt">ELÉTRICA</span><span class="mh-user" id="mh-user"></span></div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn-sino" onclick="abrirSino()" aria-label="Notificações"><i class="ti ti-bell" aria-hidden="true"></i><span class="sino-badge" style="display:none">0</span></button>
        <button class="btn-logout" onclick="logout()"><i class="ti ti-logout" aria-hidden="true"></i> Sair</button>
      </div>
    </header>
    <aside class="sidebar">
      <div class="sidebar-header">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:6px">
          <div class="sidebar-logo"><img class="brand-mark" src="/brand/logo-mark.svg" alt="AZ" /><span class="brand-txt">ELÉTRICA</span></div>
          <button class="btn-sino" onclick="abrirSino()" aria-label="Notificações"><i class="ti ti-bell" aria-hidden="true"></i><span class="sino-badge" style="display:none">0</span></button>
        </div>
        <div id="usuario-nome"></div>
      </div>
      <nav class="nav">
        <div class="nav-item active" data-tela="dashboard"><i class="ti ti-layout-dashboard" aria-hidden="true"></i> <span>Dashboard</span></div>
        <div class="nav-item" data-tela="apontamentos"><i class="ti ti-clock-check" aria-hidden="true"></i> <span>Apontamentos</span></div>
        <div class="nav-item" data-tela="obras"><i class="ti ti-building-factory-2" aria-hidden="true"></i> <span>Obras</span></div>
        <div class="nav-item" data-tela="equipe"><i class="ti ti-users" aria-hidden="true"></i> <span>Equipe</span></div>
        <div class="nav-item" data-tela="financeiro"><i class="ti ti-cash" aria-hidden="true"></i> <span>Financeiro</span></div>
        <div class="nav-item" data-tela="folha"><i class="ti ti-report-money" aria-hidden="true"></i> <span>Folha</span></div>
        <div class="nav-item" data-tela="despesas"><i class="ti ti-tools-kitchen-2" aria-hidden="true"></i> <span>Despesas</span></div>
        <div class="nav-item" data-tela="ferramentas"><i class="ti ti-tool" aria-hidden="true"></i> <span>Ferramentas</span></div>
        <div class="nav-item" data-tela="usuarios"><i class="ti ti-user-cog" aria-hidden="true"></i> <span>Usuários</span></div>
        <div class="nav-item" data-tela="orcamentos"><i class="ti ti-file-invoice" aria-hidden="true"></i> <span>Orçamentos</span></div>
      </nav>
      <div class="sidebar-footer"><button id="btn-logout" class="btn-logout">Sair</button></div>
    </aside>
    <main class="main" id="main"></main>
  </div>
</div>

<div id="portal" style="display:none"></div>

<nav class="bottom-nav" id="bottom-nav"></nav>
<div class="mais-sheet" id="mais-sheet" onclick="if(event.target===this)fecharMais()">
  <div class="mais-box"><div class="mais-titulo">Menu</div><div class="mais-grid" id="mais-grid"></div></div>
</div>

<div id="modal-root"></div>
<div id="toast" class="toast"></div>

<script src="/sw-register.js"></script>
<script src="/app2.js?v=11"></script>
<script src="/portal.js?v=3"></script>
</body>
</html>
